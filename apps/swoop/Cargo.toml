[package]
name = "swoop"
description = "Swoop: gerenciador de downloads desktop (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "swoop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
swoop-core.workspace = true
swoop-api.workspace = true
swoop-net.workspace = true
swoop-service.workspace = true
swoop-update.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
