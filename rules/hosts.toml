# Regras dos servidores (só dados). Vão embutidas no Swoop e podem ser
# sobrescritas sem recompilar por <pasta de dados>/rules/hosts.toml: o arquivo
# de lá só precisa ter as chaves que mudam (é mesclado por cima deste).
# Nenhum segredo aqui: contas e chaves ficam no cofre do sistema (fase 4).

version = 1
# Navegador que as páginas dos servidores esperam ver.
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"

[pixeldrain]
hosts = ["pixeldrain.com", "pixeldrain.net", "pixeldra.in"]
api = "https://pixeldrain.com/api"
# O gratuito é por arquivo e com cota diária: uma conexão por arquivo.
max_connections = 1

[mediafire]
hosts = ["mediafire.com"]
api = "https://www.mediafire.com/api/1.5"
# Botão de download na página do arquivo; o link pode vir embaralhado (base64)
# no atributo `scrambled_attr`.
download_selector = "a#downloadButton"
scrambled_attr = "data-scrambled-url"
# Nome na página (atributo `title` do rótulo do botão).
name_selector = "div.dl-btn-label"
# Textos (em minúsculas) de páginas que pedem o navegador.
captcha_markers = ["g-recaptcha", "verify you are human", "captcha"]
# Aviso de arquivo perigoso: a página traz um token para "baixar assim mesmo";
# o Swoop não aceita o risco pelo usuário (pede o navegador).
danger_markers = ["data-security-token", "potentially dangerous", "may contain malware", "blocked for your protection"]
password_markers = ["for=\"downloadp\"", "enter password"]
max_connections = 4

[gdrive]
hosts = ["drive.google.com", "docs.google.com", "drive.usercontent.google.com"]
download_url = "https://drive.usercontent.google.com/download"
# Página "não é possível verificar vírus": o formulário leva ao arquivo.
confirm_form_selector = "form#download-form"
# Nome e tamanho na página de confirmação: "arquivo.zip (1.2G)".
confirm_name_selector = "span.uc-name-size a"
confirm_size_selector = "span.uc-name-size"
# Pasta: página embutível; cada item é um link (arquivo ou subpasta). Links
# de Docs/Planilhas nativos são ignorados (não baixam como arquivo).
folder_url = "https://drive.google.com/embeddedfolderview"
folder_entry_selector = "a[href]"
# Textos (em minúsculas) que identificam cada situação na página.
quota_markers = ["too many users have viewed or downloaded", "download quota", "cota de download"]
missing_markers = ["file you have requested does not exist", "arquivo solicitado não existe"]
# "Muitos usuários": o Drive não diz até quando; tentar de novo depois disso.
quota_wait_minutes = 60
max_connections = 4

[xfs]
# Sites XFileSharing Pro. Os outros além do fastfile.cc seguem o mesmo
# modelo; confirmar com capturas reais (swoop-cli resolve --dump-fixtures).
hosts = ["fastfile.cc", "katfile.com", "ddownload.com"]
# Código do arquivo: 12 letras minúsculas ou números.
code_pattern = "^[a-z0-9]{12}$"
download1_op = "download1"
download2_op = "download2"
free_field = "method_free"
free_value = "Free Download"
# Contador da página do download grátis (segundos).
countdown_selector = "span.seconds, span#countdown span, #countdown_str span, #countdown, .countdown .seconds, #seconds"
max_countdown_secs = 600
# Contador escrito no JavaScript da página (var countdown = 60; seconds: 60).
countdown_script_pattern = "(?i)\\b(?:countdown|seconds|timer|wait_?time|count)\\s*[:=]\\s*['\"]?(\\d{1,4})\\b"
# Sem contador legível na página, esperar isto antes do formulário final
# (o fastfile.cc pede 60 s mesmo com captcha).
fallback_countdown_secs = 60
# Espera entre downloads (grupos: horas, minutos, segundos).
wait_pattern = "(?:you have to wait|please wait|wait)\\s+(?:(\\d+)\\s*hours?,?\\s*)?(?:(\\d+)\\s*minutes?,?\\s*)?(?:(\\d+)\\s*seconds?)?\\s*(?:till|until|before) (?:the )?next download"
size_pattern = "\\((\\d+(?:[.,]\\d+)?\\s*[KMGT]?B)\\)"
# Textos (em minúsculas) que identificam cada situação.
premium_markers = ["available for premium users only", "only premium users can download", "premium members only"]
offline_markers = ["file not found", "no such file", "file was removed", "file has been removed", "the file you were looking for could not be found"]
wrong_captcha_markers = ["wrong captcha"]
skipped_countdown_markers = ["skipped countdown", "you can not download so fast", "too fast", "please wait for the countdown"]
cloudflare_markers = ["cf-browser-verification", "challenge-platform", "just a moment..."]
# Link final na página depois do formulário (quando não vem redirecionamento).
direct_link_selector = "span#direct_link a[href], a#downloadbtn[href], a.btn-download[href]"
# Link final num redirecionamento por JavaScript (location.href = '…').
final_script_pattern = "(?:location(?:\\.href)?|location\\.replace\\()\\s*=?\\s*['\"](https?://[^'\"]+)['\"]"
# Captcha próprio do site: imagem ou dígitos posicionados.
image_captcha_selector = "img[src*='/captchas/']"
digits_captcha_selector = "td[align=right] > div[style*='padding-left'], div.captcha_code"
free_connections = 1
free_resumable = false
# Conta premium (aba Contas). Chave da API: "My Account" no site.
api_direct_link = "/api/file/direct_link"
api_account_info = "/api/account/info"
account_scheme = "https"
login_path = "/"
logged_in_markers = ["op=logout"]
bad_login_markers = ["incorrect login or password", "wrong login or password", "invalid login"]
account_page = "/?op=my_account"
premium_until_pattern = "(?i)premium(?:\\s+account)?\\s+expires?[^0-9]{0,40}(\\d{4}-\\d{2}-\\d{2}(?:\\s+\\d{2}:\\d{2}(?::\\d{2})?)?)"
premium_connections = 5
premium_resumable = true

# Rapidgator (rapidgator.net, rg.to, rapidgator.asia). A nuvem de
# desenvolvimento não alcança o site: o fluxo foi reconstruído de fontes
# abertas recentes (JDownloader RapidGatorNet.java 09/2026, pyload 0.60,
# oc-proxy-downloader 10/2026). [S] = valor sem fonte direta (o mais
# conservador). Grátis: página → AjaxStartTimer → contador → link pedido →
# captcha (Turnstile) → link. Nada aqui encurta espera ou pula captcha.
[rapidgator]
hosts = ["rapidgator.net", "rg.to", "rapidgator.asia"]
# Links de rg.to/rapidgator.asia são pedidos aqui (a chave do captcha só vale
# no domínio dela).
origin = "https://rapidgator.net"
# Arquivo: /file/<32 hex | número>[/<nome>.html] (grupo 1 = id).
file_pattern = "^/file/([0-9a-f]{32}|[0-9]+)(?:/[^/]+)?/?$"
# Pasta: /folder/<número>[/<nome>.html].
folder_pattern = "^/folder/([0-9]+)(?:/[^/]+)?/?$"
cookie = "lang=en"
name_pattern = "<title>\\s*Download file\\s+(.+?)\\s*</title>"
size_pattern = "File size:\\s*<strong>\\s*([\\d.,]+\\s*[KMGT]?B)\\s*</strong>"
# Variáveis do JavaScript da página (grupo 1 = nome, 2 = valor).
var_pattern = "var\\s+(startTimerUrl|getDownloadUrl|captchaUrl|fid|secs)\\s*=\\s*'?([^';]*)'?\\s*;"
start_timer_path = "/download/AjaxStartTimer"
get_link_path = "/download/AjaxGetDownloadLink"
captcha_path = "/download/captcha"
# Respostas JSON esperadas ({"state":"started","sid":…} e {"state":"done"}).
timer_ok = "started"
link_ok = "done"
# Contador: sem `secs` na página vale este; acima do teto = página não
# entendida (nunca se envia antes); +margem para o relógio do site.
fallback_countdown_secs = 60
max_countdown_secs = 600
countdown_margin_secs = 1
# Formulário do captcha e onde vai a resposta (o token vai em todos).
captcha_form_selector = "form#captchaform"
answer_fields = ["DownloadCaptchaForm[verifyCode]", "cf-turnstile-response"]
# Chave do Turnstile quando não vem em `data-sitekey`.
turnstile_sitekey_pattern = "sitekey['\"]?\\s*[:=]\\s*['\"](0x[0-9A-Za-z_-]{10,})['\"]"
# Prazo para a resposta depois que o captcha aparece (o J usa 105 s; envio
# atrasado bloqueia o IP por 1 h ou mais). Com menos que `captcha_min_left_secs`
# de folga, a resposta não é enviada.
captcha_deadline_secs = 100
captcha_min_left_secs = 15
# Cookie que o site grava quando a resposta chegou tarde.
late_captcha_cookie = "failed_on_captcha=1"
late_captcha_wait_minutes = 60
# Link final (grupo 1).
final_link_patterns = [
  "'(https?://[A-Za-z0-9_-]+\\.[^/'\"]+//\\?r=download/index&session_id=[A-Za-z0-9]+)'",
  "return\\s+'(https?://[^']+)'",
  "location\\.href\\s*=\\s*'(https?://[^']+)'",
]
# Textos (em minúsculas) de cada situação.
wrong_captcha_markers = ["the verification code is incorrect", "please fix the following input errors"]
offline_markers = ["404 file not found", ">error 404<", "e_filenotfound"]
premium_markers = ["can be downloaded by premium only", "can be downloaded only by subscribers", "/wallet/buyfile/"]
# "You can download files up to 500 MB in free mode" (grupo 1 = tamanho).
free_size_pattern = "you can download files up to ([\\d.,]+\\s*[kmgt]?b) in free mode"
# "Delay between downloads must be not less than 120 min" (grupo 1 = min).
delay_pattern = "delay between downloads must be not less than\\s*(\\d+)\\s*min"
hourly_markers = ["you have reached your hourly downloads limit"]
# [S] pyload 60, oc-proxy 120: o mais conservador.
hourly_wait_minutes = 120
# Limite diário: até a próxima meia-noite UTC [S].
daily_markers = ["you have reached your daily downloads limit", "you have reached your daily limit of downloads"]
one_at_a_time_markers = ["download more than 1 file at a time in free mode", "file is already downloading"]
# [S] o erro some em 30–60 s segundo o J.
one_at_a_time_wait_minutes = 10
unavailable_markers = ["file is temporarily not available", "downloading is not possible at the moment", "maintenance in data center", "an unexpected error occurred"]
unavailable_wait_minutes = 30
# Resposta fora do esperado no contador ou no link: esperar e recomeçar.
state_error_wait_minutes = 5
# Desafio do Cloudflare no site inteiro (só com HTTP 403/503).
cloudflare_markers = ["<title>just a moment...</title>", "cf_chl_opt", "cf-browser-verification"]
free_connections = 1
free_resumable = false
free_max_active = 1
# Pastas (listadas pela página, `?page=N`).
folder_file_pattern = "href=\"(/file/(?:[0-9a-f]{32}|[0-9]+)(?:/[^\"<>]+)?)\""
folder_sub_pattern = "href=\"(/folder/[0-9]+/[^\"<>?]+)\""
folder_page_pattern = "[?&]page=([0-9]+)"
folder_missing_markers = ["e_foldernotfound"]
folder_page_delay_ms = 500
folder_max_pages = 50
# Conta premium: API v2 (login por POST; o token fica só na memória).
api_path = "/api/v2/"
api_login = "user/login"
api_user_info = "user/info"
api_file_info = "file/info"
api_file_download = "file/download"
session_minutes = 45
api_wait_markers = ["please wait"]
api_wait_minutes = 5
traffic_wait_minutes = 60
# `file.mode_label` de arquivo pago/só de assinantes (minúsculas) [S].
paid_markers = ["paid", "subscri"]
premium_connections = 5
premium_resumable = true
