name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Motor, crates e CLI: não dependem da UI nem do WebView (default-members).
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all-targets
      # Os testes do swoop-api regeneram ui/src/gen (ts-rs): tem de sair igual
      # ao commitado, senão a UI está usando tipos velhos.
      - name: tipos TypeScript em dia (ui/src/gen)
        if: runner.os == 'Linux'
        run: |
          if [ -n "$(git status --porcelain ui/src/gen)" ]; then
            echo "::error::ui/src/gen desatualizado: rode 'cargo test -p swoop-api' e commite"
            git status --porcelain ui/src/gen
            git diff ui/src/gen
            exit 1
          fi
      - name: sem aws-lc-sys (build no Windows não pode exigir NASM)
        shell: bash
        run: |
          if cargo tree --workspace --target all -i aws-lc-sys >/dev/null 2>&1; then
            echo "::error::aws-lc-sys entrou na árvore de dependências (use rustls com ring)"
            cargo tree --workspace --target all -i aws-lc-sys
            exit 1
          fi

  # UI (lint + tipos + build), o app Tauri (exige ui/dist) e o instalador.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: dependências do WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm ci
        working-directory: ui
        run: npm ci
      - name: lint
        working-directory: ui
        run: npm run lint
      - name: build (tsc + vite)
        working-directory: ui
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy do app desktop e do instalador
        run: cargo clippy -p swoop -p swoop-installer --all-targets -- -D warnings
      - name: testes do instalador
        run: cargo test -p swoop-installer

  # Gera o instalador de verdade (NSIS + personalizado) como artefato: é o
  # mesmo script da release, validado antes de publicar qualquer versão.
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build (setup NSIS + instalador personalizado + hashes)
        shell: pwsh
        run: ./scripts/build-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: swoop-instaladores
          path: dist/
          retention-days: 7
