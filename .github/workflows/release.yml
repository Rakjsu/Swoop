name: Release

# Publica a versão que está no `version` do Cargo.toml. Dois jeitos:
# - GitHub → Actions → Release → "Run workflow" (na main): cria a tag
#   `v<versão>` no commit atual e publica;
# - `git tag v0.1.0 && git push origin v0.1.0`: a tag tem que bater com a versão.
# A release fica pública na hora, e os apps instalados passam a oferecer a
# atualização. Versão já publicada não é sobrescrita (o gh recusa).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: versão e tag
        id: ver
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $tag = "v$version"
          if ("${{ github.event_name }}" -eq 'push' -and $tag -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} diferente da versão $version do Cargo.toml"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build (setup NSIS + instalador personalizado + hashes)
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: publicar a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $files = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release create $tag $files `
            --target "${{ github.sha }}" `
            --title "Swoop $tag" `
            --generate-notes
